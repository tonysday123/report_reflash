<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>政策汇编 | Policy Review</title>
  <meta property="og:title" content="政策汇编">
  <meta property="og:description" content="精选近期重要政策法规，涵盖数字治理、数据安全、科技创新等关键领域">
  <meta property="og:image" content="https://tonysday123.github.io/report_reflash/icon.png">
  <meta property="og:url" content="https://tonysday123.github.io/report_reflash/">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #111111;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(255, 255, 255, 0.15);
      --text-primary: #f5f5f7;
      --text-secondary: #a1a1a6;
      --text-tertiary: #6e6e73;
      --accent-start: #6366f1;
      --accent-end: #8b5cf6;
      --accent-glow: rgba(99, 102, 241, 0.3);
      --gold: #d4a574;
      --gold-light: #e8c4a0;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.4);
      --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Animated Background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(ellipse 80% 60% at 50% -20%, rgba(99, 102, 241, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(139, 92, 246, 0.08), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .noise-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* Main Container */
    .container {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ===== HERO SECTION ===== */
    .hero {
      padding: 80px 0 60px;
      text-align: center;
      opacity: 0;
      animation: fadeInUp 0.8s var(--transition-smooth) forwards;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(139, 92, 246, 0.1));
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent-end);
      margin-bottom: 32px;
    }

    .hero-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--accent-end);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(36px, 8vw, 56px);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #fff 0%, var(--gold-light) 50%, #fff 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 8s ease-in-out infinite;
    }

    .hero-description {
      font-size: 16px;
      color: var(--text-secondary);
      line-height: 1.7;
      max-width: 480px;
      margin: 0 auto 28px;
    }

    .hero-divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-start), transparent);
      margin: 0 auto 24px;
    }

    .hero-stats {
      display: flex;
      justify-content: center;
      gap: 40px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      font-size: 24px;
      font-weight: 600;
      color: var(--text-primary);
      font-family: 'Playfair Display', serif;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 4px;
    }

    /* ===== POLICY LIST ===== */
    .policy-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-bottom: 80px;
    }

    /* ===== POLICY CARD ===== */
    .policy-card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 28px 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: var(--shadow-card);
      opacity: 0;
      transform: translateY(20px);
      transition: 
        transform var(--transition-smooth),
        border-color var(--transition-fast),
        box-shadow var(--transition-fast);
    }

    .policy-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .policy-card:hover {
      border-color: var(--card-hover-border);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--card-hover-border);
    }

    /* Card accent line */
    .policy-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 24px;
      right: 24px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-start), var(--accent-end), transparent);
      opacity: 0;
      transition: opacity var(--transition-fast);
    }

    .policy-card:hover::before {
      opacity: 1;
    }

    /* Card number */
    .card-number {
      position: absolute;
      top: 24px;
      right: 24px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      font-family: 'Playfair Display', serif;
    }

    .card-header {
      margin-bottom: 16px;
      padding-right: 30px;
    }

    .card-title {
      font-size: clamp(17px, 4vw, 19px);
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: -0.01em;
    }

    .card-title a {
      color: var(--text-primary);
      text-decoration: none;
      position: relative;
      transition: color var(--transition-fast);
    }

    .card-title a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, var(--accent-start), var(--accent-end));
      transition: width var(--transition-smooth);
    }

    .card-title a:hover {
      color: var(--gold-light);
    }

    .card-title a:hover::after {
      width: 100%;
    }

    /* Card Meta */
    .card-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .department-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.12), rgba(139, 92, 246, 0.08));
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--accent-end);
      letter-spacing: 0.02em;
    }

    .date-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-tertiary);
      font-variant-numeric: tabular-nums;
    }

    .card-summary {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Card footer */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--card-border);
    }

    .read-more {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-tertiary);
      text-decoration: none;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: color var(--transition-fast);
    }

    .read-more svg {
      width: 14px;
      height: 14px;
      transition: transform var(--transition-fast);
    }

    .read-more:hover {
      color: var(--accent-end);
    }

    .read-more:hover svg {
      transform: translateX(4px);
    }

    /* ===== FOOTER ===== */
    .footer {
      padding: 40px 0;
      text-align: center;
      border-top: 1px solid var(--card-border);
    }

    .footer-logo {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 600;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .footer p {
      font-size: 12px;
      color: var(--text-tertiary);
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @keyframes shimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* ===== RESPONSIVE ===== */
    @media (min-width: 768px) {
      .container {
        padding: 0 32px;
      }

      .hero {
        padding: 100px 0 72px;
      }

      .hero-stats {
        gap: 56px;
      }

      .policy-card {
        padding: 32px 28px;
      }

      .card-number {
        right: 28px;
      }

      .card-header {
        padding-right: 40px;
      }
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-tertiary);
    }
  </style>
</head>
<body>
  <div class="noise-overlay"></div>
  
  <main class="container">
    <header class="hero">
      <div class="hero-badge">2024 Policy Review</div>
      <h1>政策汇编</h1>
      <p class="hero-description">
        精选近期重要政策法规，涵盖数字治理、数据安全、科技创新等关键领域，为您提供权威信息参考。
      </p>
      <div class="hero-divider"></div>
      <div class="hero-stats">
        <div class="stat-item">
          <div class="stat-number" id="policyCount">0</div>
          <div class="stat-label">政策法规</div>
        </div>
        <div class="stat-item">
          <div class="stat-number">6</div>
          <div class="stat-label">主管部门</div>
        </div>
        <div class="stat-item">
          <div class="stat-number">2024</div>
          <div class="stat-label">年度发布</div>
        </div>
      </div>
    </header>

    <section class="policy-list" id="policyList">
      <!-- Cards rendered by JS -->
    </section>

    <footer class="footer">
      <div class="footer-logo">Policy Review</div>
      <p>数据来源为公开渠道，仅供参考</p>
    </footer>
  </main>

  <script>
    // 示例政策数据
    const policies = [
      {
        title: "关于加强数字政府建设的指导意见",
        url: "https://www.gov.cn/zhengce/content/2022-06/23/content_5697238.htm",
        summary: "推进政务服务数字化、智能化转型，构建协同高效的政府数字化履职能力体系，提升政务服务标准化、规范化、便利化水平。",
        department: "国务院",
        date: "2024.01.15"
      },
      {
        title: "数据安全管理办法（征求意见稿）",
        url: "https://www.cac.gov.cn",
        summary: "规范数据处理活动，保障数据安全，促进数据开发利用，保护个人、组织的合法权益，维护国家主权、安全和发展利益。",
        department: "国家网信办",
        date: "2024.02.20"
      },
      {
        title: "关于推动平台经济规范健康持续发展的意见",
        url: "https://www.ndrc.gov.cn",
        summary: "完善平台经济治理体系，建立健全平台经济常态化监管机制，推动平台经济规范健康持续发展，激发市场主体活力。",
        department: "国家发改委",
        date: "2024.03.08"
      },
      {
        title: "人工智能伦理治理指南",
        url: "https://www.most.gov.cn",
        summary: "明确人工智能技术研发和应用中的伦理原则，推动建立符合国际伦理标准的人工智能治理框架，促进 AI 负责任发展。",
        department: "科技部",
        date: "2024.04.12"
      },
      {
        title: "关于完善能源绿色低碳转型体制机制的意见",
        url: "https://www.nea.gov.cn",
        summary: "健全能源绿色低碳转型体制机制，完善能源消费总量和强度调控，推动能源生产和消费革命，构建清洁低碳安全高效的能源体系。",
        department: "国家能源局",
        date: "2024.05.06"
      },
      {
        title: "中小企业数字化转型指南",
        url: "https://www.miit.gov.cn",
        summary: "为中小企业提供数字化转型路径指引，降低转型门槛和成本，推动中小企业通过数字化手段提升核心竞争力和抗风险能力。",
        department: "工信部",
        date: "2024.05.28"
      }
    ];

    // 渲染政策列表
    function renderPolicies() {
      const container = document.getElementById('policyList');
      const countEl = document.getElementById('policyCount');

      // Animate count
      let count = 0;
      const target = policies.length;
      const interval = setInterval(() => {
        count++;
        countEl.textContent = count;
        if (count >= target) clearInterval(interval);
      }, 150);

      if (policies.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="text-align: center; padding: 80px 24px; color: var(--text-tertiary);">
            <p style="font-size: 14px;">暂无政策数据</p>
          </div>
        `;
        return;
      }

      container.innerHTML = policies.map((policy, index) => `
        <article class="policy-card" style="transition-delay: ${index * 0.1}s">
          <span class="card-number">${String(index + 1).padStart(2, '0')}</span>
          
          <div class="card-header">
            <h2 class="card-title">
              <a href="${policy.url}" target="_blank" rel="noopener noreferrer">${policy.title}</a>
            </h2>
          </div>
          
          <div class="card-meta">
            <span class="department-tag">
              ${policy.department}
            </span>
            <span class="date-tag">
              ${policy.date}
            </span>
          </div>
          
          <p class="card-summary">${policy.summary}</p>
          
          <div class="card-footer">
            <a href="${policy.url}" target="_blank" rel="noopener noreferrer" class="read-more">
              查看原文
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
              </svg>
            </a>
          </div>
        </article>
      `).join('');

      // Trigger reveal animation
      requestAnimationFrame(() => {
        const cards = document.querySelectorAll('.policy-card');
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1 });

        cards.forEach(card => observer.observe(card));
      });
    }

    // 初始化渲染
    document.addEventListener('DOMContentLoaded', renderPolicies);
  </script>
</body>
</html>
